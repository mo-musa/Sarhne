<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sarhne Message SignalR Test</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin-right: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #status {
            margin: 20px 0;
            font-weight: bold;
        }

        #messages {
            margin-top: 20px;
        }

        .message {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

            .message.anonymous {
                border-left: 5px solid #888;
            }

        .message-status {
            font-weight: bold;
        }

        .empty {
            color: #777;
        }

        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h1>Sarhne Message SignalR Test</h1>

    <!-- ========================================================= -->
    <!-- JWT -->
    <!-- ========================================================= -->

    <label>
        JWT Token:
    </label>

    <textarea id="token"
              placeholder="Paste your JWT token here..."></textarea>

    <div>

        <button onclick="connect()">
            Connect
        </button>

        <button onclick="disconnect()">
            Disconnect
        </button>

    </div>

    <div id="status">
        Status: Disconnected
    </div>


    <!-- ========================================================= -->
    <!-- Messages -->
    <!-- ========================================================= -->

    <h2>Messages</h2>

    <div id="messages">

        <div class="empty">
            No messages received yet.
        </div>

    </div>


    <script>

        let connection = null;


        // =========================================================
        // Connect
        // =========================================================

        async function connect() {

            const token =
                document
                    .getElementById("token")
                    .value
                    .trim();

            if (!token) {

                alert("Please enter JWT token.");

                return;
            }


            if (connection) {

                console.log(
                    "SignalR connection already exists."
                );

                return;
            }


            connection =
                new signalR.HubConnectionBuilder()

                    .withUrl("/hubs/messages", {

                        accessTokenFactory: () => token

                    })

                    .withAutomaticReconnect()

                    .build();


            // =====================================================
            // Message Received
            // =====================================================

            connection.on(
                "MessageReceived",
                message => {

                    console.log(
                        "Message received:",
                        message
                    );

                    displayMessage(message);

                }
            );


            // =====================================================
            // Message Read
            // =====================================================

            connection.on(
                "MessageRead",
                message => {

                    console.log(
                        "Message marked as read:",
                        message
                    );

                    markMessageAsRead(
                        message.messageId
                    );

                }
            );


            // =====================================================
            // Reconnecting
            // =====================================================

            connection.onreconnecting(error => {

                setStatus(
                    "Reconnecting..."
                );

                console.error(
                    "SignalR reconnecting:",
                    error
                );

            });


            // =====================================================
            // Reconnected
            // =====================================================

            connection.onreconnected(connectionId => {

                setStatus(
                    "Connected"
                );

                console.log(
                    "SignalR reconnected:",
                    connectionId
                );

            });


            // =====================================================
            // Closed
            // =====================================================

            connection.onclose(error => {

                setStatus(
                    "Disconnected"
                );

                console.error(
                    "SignalR connection closed:",
                    error
                );

                connection = null;

            });


            // =====================================================
            // Start
            // =====================================================

            try {

                await connection.start();

                setStatus(
                    "Connected"
                );

                console.log(
                    "SignalR connected."
                );

            }
            catch (error) {

                setStatus(
                    "Connection failed"
                );

                console.error(
                    "SignalR connection failed:",
                    error
                );

                connection = null;

            }
        }


        // =========================================================
        // Disconnect
        // =========================================================

        async function disconnect() {

            if (!connection)
                return;


            try {

                await connection.stop();

            }
            catch (error) {

                console.error(
                    "SignalR disconnect failed:",
                    error
                );

            }


            connection = null;

            setStatus(
                "Disconnected"
            );
        }


        // =========================================================
        // Status
        // =========================================================

        function setStatus(status) {

            document
                .getElementById("status")
                .innerText =
                `Status: ${status}`;
        }


        // =========================================================
        // Display Message
        // =========================================================

        function displayMessage(message) {

            const container =
                document.getElementById(
                    "messages"
                );


            // Remove empty message
            const empty =
                container.querySelector(
                    ".empty"
                );

            if (empty)
                empty.remove();


            const element =
                document.createElement("div");

            element.className =
                "message";


            if (message.isAnonymous) {

                element.classList.add(
                    "anonymous"
                );

            }


            // Keep message ID
            element.dataset.messageId =
                message.id;


            const senderName =
                message.isAnonymous
                    ? "Anonymous"
                    : (
                        message.senderUserName
                        ?? "Unknown"
                    );


            element.innerHTML = `

                    <strong>
                        ${escapeHtml(senderName)}
                    </strong>

                    <p>
                        ${escapeHtml(
                message.content ?? ""
            )}
                    </p>

                    ${message.photoUrl
                    ? `
                                <p>
                                    <a
                                        href="${escapeAttribute(message.photoUrl)}"
                                        target="_blank">
                                        View Photo
                                    </a>

                                    <br />

                                    <img
                                        src="${escapeAttribute(message.photoUrl)}"
                                        style="max-width:300px; margin-top:10px;"
                                        alt="Message photo">
                                </p>
                              `
                    : ""
                }

                    <small>

                        <br />

                        ID:
                        ${message.id}

                        <br />

                        Anonymous:
                        ${message.isAnonymous}

                        <br />

                        Sender ID:
                        ${message.senderId ?? "null"}

                        <br />

                        Sender Username:
                        ${escapeHtml(
                    message.senderUserName
                    ?? "null"
                )}

                        <br />

                        Created:
                        ${message.createdAt}

                        <br />

                        Read:
                        <span class="message-status">
                            ${message.isRead}
                        </span>

                        <br />

                        Starred:
                        ${message.isStarred}

                        <br />

                        Likes:
                        ${message.likesCount}

                    </small>

                `;


            container.prepend(element);
        }


        // =========================================================
        // Mark Message As Read
        // =========================================================

        function markMessageAsRead(messageId) {

            const element =
                document.querySelector(
                    `[data-message-id="${messageId}"]`
                );


            if (!element) {

                console.warn(
                    "Message element not found:",
                    messageId
                );

                return;
            }


            const status =
                element.querySelector(
                    ".message-status"
                );


            if (!status) {

                console.warn(
                    "Message status element not found:",
                    messageId
                );

                return;
            }


            status.innerText =
                "true";
        }


        // =========================================================
        // HTML Escape
        // =========================================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function escapeAttribute(value) {

            return escapeHtml(value);

        }

    </script>

</body>
</html>
